<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Clock</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="background"></div>
    <div id="photo"></div>

    <header>
        <div class="toggle glass">
            <input type="radio" name="format" id="hour12">
            <label for="hour12">12h</label>
            <input type="radio" name="format" id="hour24">
            <label for="hour24">24h</label>
        </div>
    </header>

    <main>
        <section id="clock-box" class="glass">
            <p id="date"></p>
            <h1 id="time"></h1>
            <p id="time-zone"></p>
        </section>
    </main>

    <footer>
        <section id="weather-box" class="glass">
            <p class="small-title">Today's weather</p>
        </section>

        <section id="quote-box" class="glass">
            <p class="small-title">NASA picture of the day</p>
        </section>
    </footer>

    <script src="model.js"></script>
    <script src="view.js"></script>
    <script src="controller.js"></script>
</body>
</html>
