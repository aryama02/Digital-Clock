<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Clock</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="background"></div>

    <header>
        <button id="settings-button" class="glass">Settings</button>
        <div id="settings">
            <div class="pill glass">
                <label for="brightness">Brightness</label>
                <input type="range" id="brightness" min="20" max="100">
            </div>
            <div class="toggle glass">
                <input type="radio" name="format" id="hour12">
                <label for="hour12">12h</label>
                <input type="radio" name="format" id="hour24">
                <label for="hour24">24h</label>
            </div>
            <div class="toggle glass">
                <input type="radio" name="unit" id="fahrenheit">
                <label for="fahrenheit">°F</label>
                <input type="radio" name="unit" id="celsius">
                <label for="celsius">°C</label>
            </div>
            <button id="close-button" class="glass">&times;</button>
        </div>
    </header>

    <main>
        <section id="clock-box" class="glass">
            <p id="date"></p>
            <h1 id="time">--:--</h1>
            <p id="time-zone"></p>
            <p id="sky"></p>
        </section>
    </main>

    <div id="weather-box" class="glass">
        <p class="small-title">Today's weather</p>
        <p id="temperature">--°</p>
        <p id="condition">Finding your location...</p>
        <p id="feels-like">Feels like -- · Rain chance --</p>
        <p id="humidity">Humidity -- · Wind --</p>
    </div>

    <div id="timer-box" class="glass">
        <p class="small-title">Study timer</p>
        <p id="timer-display">25:00</p>
        <label for="timer-minutes">Minutes</label>
        <input type="number" id="timer-minutes" min="1" max="120" value="25">
        <div class="timer-buttons">
            <button id="start-button">Start</button>
            <button id="reset-button">Reset</button>
        </div>
        <div id="timer-bar"></div>
    </div>

    <div id="quote-box" class="glass">
        <p class="small-title" id="picture-prompt">Explore today's picture</p>
    </div>

    <dialog id="picture-dialog" class="glass">
        <button id="close-picture">&times;</button>
        <p class="small-title">NASA space story</p>
        <div id="day-buttons">
            <button class="day-button"></button>
            <button class="day-button"></button>
            <button class="day-button"></button>
        </div>
        <h2 id="picture-title">Loading...</h2>
        <p id="picture-text"></p>
        <p id="picture-credit"></p>
    </dialog>

    <div id="dim"></div>

    <script src="model.js"></script>
    <script src="view.js"></script>
    <script src="controller.js"></script>
</body>
</html>
